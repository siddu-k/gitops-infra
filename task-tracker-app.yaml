apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-tracker-dev
  namespace: argocd
spec:
  project: default
  source:
    # TODO: replace siddu-k with your GitHub username
    repoURL: https://github.com/siddu-k/gitops-infra.git
    targetRevision: main
    path: dev/task-tracker
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
