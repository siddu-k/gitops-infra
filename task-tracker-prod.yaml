apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-tracker-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/siddu-k/gitops-infra.git
    targetRevision: main
    path: prod/task-tracker

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
