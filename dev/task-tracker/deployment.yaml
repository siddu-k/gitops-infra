apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
    spec:
      containers:
        - name: task-tracker
          image: nginx:1.27
          ports:
            - containerPort: 80
